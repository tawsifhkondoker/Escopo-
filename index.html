<!DOCTYPE html>

<html>
    <head>
        <title>ESCOPO</title>
        <link rel="stylesheet" href="style.css">
    </head>  
        <body>
            <div class="game">
               
               <h1 id="clock">11:59</h1>
               <p>You are shut in a room.</p>

                <div class="door" id = "door">
                    <p>DOOR</p>
                    <div class="handle"></div>
                </div>

                <div class="desk" id = "desk">
                    <p>DESK</p>
                    
                </div>
                <div class="compartment" id="compartment">
                    <p>LOCKED COMPARTMENT</p>
                </div>
                <img id="key" src="images/key.png" draggable="true">
                    
                
               
                <div class ="box" id = "box">
                    <p>LOCKED BOX</p>
                    <div class="photo" id = "photo">
                        <p>11:36 PM</p>
                    </div>
                </div>
                <div class="code-panel">
                    <input id="codeInput" type="text" placeholder="Enter code" maxlength="8" >
                    <button id="unlockButton">UNLOCK</button>
                </div>
                <p id="message"></p>
            </div>
               
                
                <div id="endingScreen">
                    <h1>Congratulations!</h1>
                    <p>You escaped the room.</p>
                    <p>You finally cracked ESCOPO.</p>
                    <p>Made by Tawsif Khondoker</p>
                    <button id="restartButton">PLAY AGAIN</button>
                </div>
            
            
            
            <script src="script.js"></script>
        </body>
    
</html>
